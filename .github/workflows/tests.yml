name: Python-Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Syntax und Unit-Tests pruefen
        run: |
          python -m compileall -q app.py pruefung.py workflow.py streamlit_app.py tests
          python -m unittest discover -s tests -v
